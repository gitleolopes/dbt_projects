version: 2

models:
  - name: fct_bigquery
    description: Bigquery jobs and processing. SCRIPT statements are excluded because they do not represent direct cost drivers.
    columns:
      - name: job_id
        description: The ID of the job
        tests:
          - not_null
          - unique
      - name: user_email
        description:  Email address or service account of the user who ran the job.
        tests:
          - not_null
      - name: project_id
        description: The ID of the project.
        tests:
          - not_null
      - name: total_bytes_processed
        description: Total bytes processed by the job.
      - name: total_tbytes_processed
        description: Total tbytes processed by the job.
      - name: total_cost
        description: Total processing cost by the job.
      - name: creation_date
        description: Creation date of this job.
        tests:
          - not_null
      - name: query
        description: SQL query text.
      

